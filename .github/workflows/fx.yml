name: fx-card

on:
  schedule:
    - cron: "20 */6 * * *"   # 6시간마다 (UTC) — 유럽중앙은행 환율은 하루 한 번 바뀜
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fonts
        run: |
          mkdir -p fonts
          for w in Regular Bold ExtraBold; do
            curl -sSfL -o fonts/Pretendard-$w.otf https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/public/static/Pretendard-$w.otf
          done
      - run: pip install pillow==10.4.0
      - run: python make_fx.py
      - name: Commit if changed
        run: |
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add out/fx.png out/fx.json
          git diff --cached --quiet || git commit -m "fx $(date -u +%F)"
          git push
